name: Collect hourly news

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: finnews-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run collector
        env:
          NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
          NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
        run: python3 scripts/collect_hourly.py

      - name: Commit buffer if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/buffer.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: hourly news collection $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
